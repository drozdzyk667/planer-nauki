<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>Isolated code runner</title>
  </head>
  <body>
    <script>
      "use strict";
      parent.postMessage({ type: "sandbox-ready" }, "*");
      let worker;
      let timer;
      addEventListener("message", (event) => {
        if (event.source !== parent || !event.data) return;
        if (event.data.type === "ping") {
          parent.postMessage({ type: "sandbox-ready" }, "*");
          return;
        }
        if (event.data.type !== "run") return;
        const { id, code, tests } = event.data;
        if (
          typeof code !== "string" ||
          code.length > 20000 ||
          !Array.isArray(tests)
        )
          return;
        if (worker) worker.terminate();
        if (timer) clearTimeout(timer);
        const source = `self.onmessage = function(event) {
    const {code, tests} = event.data;
    const logs=[];
    const safeConsole={log:(...args)=>{if(logs.length<50)logs.push(args.map(v=>typeof v==='string'?v:JSON.stringify(v)).join(' ').slice(0,1000));}};
    try {
      const expressions=tests.map(expression=>'Boolean('+expression+')').join(',');
      const run=new Function('console','__logs','"use strict";\\n'+code+'\\n;return ['+expressions+'];');
      const results=run(safeConsole,logs);
      self.postMessage({status:'ok',logs,results});
    } catch(error) { self.postMessage({status:'error',logs,error:String(error).slice(0,500)}); }
  }`;
        const url = URL.createObjectURL(
          new Blob([source], { type: "text/javascript" }),
        );
        try {
          worker = new Worker(url);
        } catch {
          parent.postMessage(
            { id, status: "error", error: "Worker unavailable", logs: [] },
            "*",
          );
          URL.revokeObjectURL(url);
          return;
        }
        URL.revokeObjectURL(url);
        timer = setTimeout(() => {
          worker.terminate();
          parent.postMessage({ id, status: "timeout", logs: [] }, "*");
        }, 1800);
        worker.onmessage = (e) => {
          clearTimeout(timer);
          worker.terminate();
          parent.postMessage({ ...e.data, id }, "*");
        };
        worker.onerror = () => {
          clearTimeout(timer);
          worker.terminate();
          parent.postMessage(
            { id, status: "error", error: "Execution failed", logs: [] },
            "*",
          );
        };
        worker.postMessage({ code, tests });
      });
    </script>
  </body>
</html>
